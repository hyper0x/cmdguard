name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          check-latest: true
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          COMMIT=$(git rev-parse --short HEAD)
          BINARY=cmdguard
          [ "${{ matrix.goos }}" = "windows" ] && BINARY=cmdguard.exe
          go build -ldflags "-X main.version=$VERSION -X main.commit=$COMMIT" -o $BINARY .
          ARCHIVE=cmdguard_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip ${ARCHIVE}.zip $BINARY
          else
            tar czf ${ARCHIVE}.tar.gz $BINARY
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cmdguard_*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect archives
        run: find artifacts -type f -exec cp {} . \;
      - name: Upload release
        uses: softprops/action-gh-release@v2
        with:
          files: cmdguard_*.tar.gz cmdguard_*.zip
          fail_on_unmatched_files: true

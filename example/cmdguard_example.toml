# ============================================
# cmdguard 配置文件
# ============================================
# 路径保护规则，支持 glob 模式（** 匹配任意层级）
# 按保护级别分组（从严格到宽松）：
#
#   reject           🚫  直接拒绝，不执行
#   confirm_double   🔒  警告 + 双层确认（输入 yes）→ 备份 → 执行
#   confirm          ❓  警告 + 单层确认（按 y）→ 备份 → 执行
#   warn             ⚠️  警告 + 备份 → 执行
#
# 规则匹配顺序：reject → confirm_double → confirm → warn
# 匹配到第一条即停止，所以更严格的规则应放在前面。

[protect]
reject = [
  # macOS/Linux 系统目录
  "/bin/**",
  "/boot/**",
  "/dev/**",
  "/etc/**",
  "/lib/**",
  "/lib64/**",
  "/proc/**",
  "/sbin/**",
  "/sys/**",
  "/usr/**",
  "/var/**",
  "/opt/**",
  "/System/**",
  "/Library/**",
  "/Applications/**",
  # 密钥文件 — 不可再生
  "*.key",
  "*.pem",
  "*.crt",
  "*.p12",
  "*.pfx",
  "*.asc",
  # 家目录关键配置 — 不可再生
  "~/.ssh/**",
  "~/.gnupg/**",
]

confirm_double = [
  # 家目录应用数据 — 可清理但需双重确认
  "~/.config/**",
  "~/.local/share/**",
]

confirm = [
  "~/Documents/archive/**",
]

warn = [
  "~/Downloads/**",
]

# 按命令覆盖
[protect.command.rm]
reject = [
  "~/Documents/不许删",
]

[protect.command.mv]
reject = [
  "~/Projects/important",
]

[protect.command.chmod]
reject = [
  "~/Projects/important",
]

# Vault 备份设置
[vault]
retention_days = 30
auto_purge = true

# ============================================
# cmdguard configuration file
# ============================================
# Path protection rules using glob patterns (** matches any depth).
# Organized by protection level (strict to lenient):
#
#   reject    🚫   directly rejected, not executed (even with --bypass)
#   guarded   🔒   rejected without --bypass; with valid --bypass -> backup -> execute
#   allow     ✅   executed directly (default for unmatched paths)
#
# Rule matching order: reject -> guarded
# First match wins, so stricter rules should come first.
# Paths not matching any rule are allowed by default.
#
# ⚠️  IMPORTANT: Source of truth
# When this file defines a [protect] section, its rules are used
# as-is - built-in defaults are NOT merged on top.
# If you want NO reject rules, write "reject = []".
# If you remove the entire [protect] section, built-in defaults apply.

[protect]
reject = [
  # macOS/Linux system directories
  "/bin/**",
  "/boot/**",
  "/dev/**",
  "/etc/**",
  "/lib/**",
  "/lib64/**",
  "/proc/**",
  "/sbin/**",
  "/sys/**",
  "/usr/**",
  "/var/**",
  "/opt/**",
  "/private/**",
  "/System/**",
  "/Library/**",
  "/Applications/**",
  # Key files - non-recoverable
  "*.key",
  "*.pem",
  "*.crt",
  "*.p12",
  "*.pfx",
  "*.asc",
  # Home directory critical config - non-recoverable
  "~/.ssh/**",
  "~/.gnupg/**",
]

guarded = [
  # Home directory app data - requires --bypass to proceed
  "~/.config/**",
  "~/.local/share/**",
  "~/Documents/**",
  "~/Desktop/**",
]

# Per-command overrides - apply stricter protection for specific commands.
# Example: global rules set ~/.config/** to guarded, but rm is more
# dangerous so we override it to reject for rm only.
[protect.command.rm]
reject = [
  "~/.config/**",
]

# mv protects the destination path (last argument). Reject mv into
# ~/Downloads/** to prevent accidental overwrites.
[protect.command.mv]
reject = [
  "~/Downloads/**",
]

# chmod changes permissions. Reject for app config directories
# (global rules set ~/.config/** to guarded).
[protect.command.chmod]
reject = [
  "~/.config/**",
]

# Vault backup settings
[vault]
retention_days = 7
auto_purge = true

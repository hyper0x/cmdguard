# golangci-lint configuration.
#
# We run golangci-lint v2 (`brew install golangci-lint` on macOS).
# v2 changed the schema: linters live under `linters.enable`, and
# per-rule exclusions live under `linters.exclusions.rules`.
#
# Why this file exists:
#   1. Pin the active linter set so `golangci-lint run` is
#      reproducible across contributors and CI (no "default changed
#      in v2.13"). `default: none` means ONLY the linters listed below
#      run — nothing implicit.
#   2. Suppress noise inside *_test.go where the standard pattern is
#      os.Setenv / w.Close / buf.ReadFrom / os.MkdirAll without explicit
#      error handling. Production code still gets the full check.
#
# Linter philosophy:
#   - Real-bug catchers (errcheck, gosec, errorlint, nilerr, exhaustive,
#     …) are ON at default thresholds. Every finding they surface is
#     either a bug we fix or a documented false positive (`// #nosec`).
#   - gocyclo is kept at a deliberately high threshold (70) because the
#     three CLI dispatchers (RunGuard/RunInit/RunUndo) are inherently
#     big switch-on-subcommand functions; the value is in preventing NEW
#     complexity, not flagging what we already know about.
#   - Modernisation linters (modernize, intrange, copyloopvar) push us
#     toward Go 1.22+ idioms (CutPrefix, SplitSeq, slices.Contains,
#     min(), interface{}→any, range-over-int).
#   - misspell / gocritic / unconvert / predeclared / forcetypeassert /
#     dupword / godot / asciicheck / bidichk / dupl / etc. currently
#     produce zero findings on this codebase, but we keep them enabled
#     as a regression fence: the day someone adds a typo or an
#     unnecessary conversion, CI catches it instead of a reviewer.
#
# Deliberately NOT enabled:
#   - goconst   — 46 findings, almost all test data ("--bogus", "rm",
#     "list"…). Extracting test literals to constants harms readability.
#   - gocognit  — duplicates gocyclo with a different complexity metric.
#   - nestif    — duplicates gocyclo for nesting depth.
#   - Various framework-specific linters (bodyclose, sqlclosecheck,
#     protogetter, …) — cmdguard has no HTTP / SQL / protobuf.
#
# Run:    golangci-lint run ./...
# Update: golangci-lint config verify
version: "2"

linters:
  default: none
  enable:
    # ── Built-ins that always pay off ──────────────────────────
    - errcheck        # unchecked error returns (the most frequent real bug)
    - govet           # the official `go vet` rules
    - ineffassign     # assignments whose result is never read
    - staticcheck     # SA-/ST-/QF- rules; the single most valuable set
    - unused          # dead code (functions, vars, types, consts)

    # ── Security & correctness ─────────────────────────────────
    - gosec            # G1xx/G3xx/G7xx security checks (path traversal, hardcoded creds, …)
    - errorlint        # use errors.As/Is/wrap instead of == / type-assertion
    - nilerr           # detect `if err != nil { return nil }` patterns that drop errors
    - nilnil           # simultaneous return of nil error + invalid value
    - exhaustive       # missing cases in switch / type switch
    - gochecksumtype   # exhaustiveness for sum-type-style type switches
    - wastedassign     # assignments that are overwritten before being read
    - reassign         # package-level variables that get reassigned
    - unparam          # unused function parameters

    # ── Input validation & safety ──────────────────────────────
    - bidichk          # dangerous Unicode (trojan source / bidi override)
    - asciicheck       # non-ASCII identifiers
    - gocheckcompilerdirectives  # malformed //go: directives

    # ── Modernisation (Go 1.22–1.26 idioms) ───────────────────
    - modernize        # CutPrefix/CutSuffix, SplitSeq, slices.Contains, min(), any, …
    - intrange        # for i := range N instead of for i := 0; i < N; i++
    - copyloopvar     # Go 1.22+ loop variable capture semantics

    # ── Performance micro-optimisation ─────────────────────────
    - prealloc         # preallocate slices when size is known upfront
    - perfsprint       # fmt.Sprintf → strconv/errors.New where applicable

    # ── Meta-linter ────────────────────────────────────────────
    - nolintlint       # validate //nolint / #nosec directives are well-formed

    # ── Style & polish (regression fence — 0 findings today) ──
    - misspell         # typos in comments/strings
    - gocritic         # style/perf/bug-prone patterns
    - unconvert        # unnecessary type conversions
    - predeclared     # shadowing predeclared identifiers (e.g. `cap`, `len`)
    - forcetypeassert  # unchecked type assertions (panic risk)
    - dupword          # duplicate words ("the the") in comments/strings
    - godot            # comments should end with a period
    - errname          # error variables should be named ErrXxx
    - dupl             # duplicate code blocks (copy-paste detection)
    - errchkjson       # unsupported types passed to json.Marshal/Encode
    - durationcheck    # two time.Duration values multiplied together
    - makezero         # make() with non-zero length followed by append

    # ── Complexity (high threshold — see header comment) ──────
    - gocyclo

  settings:
    gocyclo:
      # The three CLI dispatchers (RunGuard=67, RunInit=38, RunUndo=57)
      # are intentionally large switch-on-subcommand functions. We set
      # the threshold above the worst case so the linter acts as a
      # regression guard against NEW over-complex functions rather than
      # nagging about the existing ones.
      min-complexity: 70
    gosec:
      # #nosec directives cover genuine false positives per-site.
      # No global exclusions — keeping it explicit.
      excludes: []

  exclusions:
    rules:
      # Test files routinely ignore os.Setenv/Unsetenv, WriteFile,
      # MkdirAll, w.Close on test pipes, etc. The bug surface in tests
      # is tiny and the diagnostic clutter is large. Production code
      # still goes through errcheck unchanged.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - forcetypeassert
          - prealloc
          - gocyclo
          - wastedassign
          - unparam
